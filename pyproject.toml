[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge-gene-imputation"
version = "1.0.0"
description = "Body-wide Representation via Inter-tissue Decoding Gene Expression"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Jingbo Yang"},
  {name = "Ronnie Li"},
  {name = "Zhaohui Qin"},
]
dependencies = [
  "numpy",
  "pandas",
  "torch",
]

[project.optional-dependencies]
test = ["pytest"]
analysis = [
  "scipy",
  "scikit-learn",
  "matplotlib",
  "seaborn",
  "h5py",
  "pyyaml",
  "openpyxl",
]

[tool.setuptools.packages.find]
include = ["bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

